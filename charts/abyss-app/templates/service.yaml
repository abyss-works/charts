apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}
  namespace: {{ include "abyss-app.namespace" . }}
  labels:
    {{- include "abyss-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "abyss-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
