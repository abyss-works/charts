{{- if .Values.operatorAccess.enabled }}
{{- $saName := .Values.operatorAccess.serviceAccountName | default (printf "%s-operator" .Values.app) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ include "abyss-app.namespace" . }}
  labels:
    {{- include "abyss-app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.operatorAccess.clusterRoleName | default "namespace-owner" }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Values.operatorAccess.serviceAccountNamespace | default "cluster-access" }}
{{- end }}
