app: blog
environment: preview

image:
  repository: ghcr.io/abyss-works/blog
  tag: git-example

command:
  - /bin/sh
  - -ec
args:
  - |
    export DATABASE_URL="$(node -e 'const e = encodeURIComponent; process.stdout.write(`postgresql://${e(process.env.POSTGRES_USER)}:${e(process.env.POSTGRES_PASSWORD)}@postgres:5432/${e(process.env.POSTGRES_DB)}`)')"
    prisma migrate deploy
    unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
    exec node server.js

envFrom:
  - configMapRef:
      name: blog
  - configMapRef:
      name: postgres
  - secretRef:
      name: postgres
  - secretRef:
      name: better-auth

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /
    port: 3000
  periodSeconds: 5
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 5

configMaps:
  blog:
    data:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BETTER_AUTH_URL: https://blog-preview.abyssworks.dev
      DEPLOY_ENV: preview
  postgres:
    data:
      POSTGRES_DB: blog

# Transitional legacy Postgres until CNPG migration completes.
extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-pvc
      labels:
        app: postgres
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgres
      labels:
        app: postgres
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: postgres
      template:
        metadata:
          labels:
            app: postgres
        spec:
          automountServiceAccountToken: false
          priorityClassName: app-infra
          nodeSelector:
            kubernetes.io/hostname: oci-node
          containers:
            - name: postgres
              image: postgres:16-alpine
              envFrom:
                - configMapRef:
                    name: postgres
                - secretRef:
                    name: postgres
              ports:
                - containerPort: 5432
              startupProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                periodSeconds: 5
                failureThreshold: 30
              livenessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
              readinessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                periodSeconds: 5
                timeoutSeconds: 5
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: pgdata
                  mountPath: /var/lib/postgresql/data
          volumes:
            - name: pgdata
              persistentVolumeClaim:
                claimName: postgres-pvc
  - apiVersion: v1
    kind: Service
    metadata:
      name: postgres
    spec:
      type: ClusterIP
      selector:
        app: postgres
      ports:
        - name: postgres
          port: 5432
          targetPort: 5432
