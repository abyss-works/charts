name: Chart Lint and Validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Lint charts/abyss-app
        run: helm lint charts/abyss-app

      - name: Template and validate examples with kubeconform
        run: |
          set -eo pipefail
          for f in charts/abyss-app/examples/values-*.yaml; do
            echo "=== Validating ${f} ==="
            name=$(basename "${f}" .yaml | sed 's/^values-//')
            helm template "${name}" charts/abyss-app -f "${f}" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: Negative schema check (reject environment=stage)
        run: |
          if helm template bad charts/abyss-app \
            -f charts/abyss-app/examples/values-hamsudoku-preview.yaml \
            --set environment=stage >/dev/null 2>&1; then
            echo "Expected schema validation failure for environment=stage"
            exit 1
          fi
          echo "Schema correctly rejected environment=stage"
